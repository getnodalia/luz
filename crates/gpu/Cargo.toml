[package]
name = "luz-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Luz GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
luz-denoise = { workspace = true, optional = true }
luz-geom = { workspace = true }
luz-color = { workspace = true }
luz-raster = { workspace = true }
luz-develop = { workspace = true }
luz-faces = { workspace = true }
luz-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:luz-denoise", "luz-denoise/runtime"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
luz-testkit = { workspace = true }
luz-scenes = { workspace = true }
luz-raw = { workspace = true }
