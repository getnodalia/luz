[package]
name = "luz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Luz engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
nodalia-docpath = { workspace = true }
luz-geom = { workspace = true }
luz-color = { workspace = true }
luz-raster = { workspace = true }
luz-develop = { workspace = true }
luz-scenes = { workspace = true }
luz-pipeline = { workspace = true }
luz-gpu = { workspace = true }
luz-catalog = { workspace = true }
web-time = { workspace = true }
luz-preview = { workspace = true }
luz-codecs = { workspace = true }
luz-raw = { workspace = true }
luz-denoise-core = { workspace = true }
luz-denoise = { workspace = true, optional = true }
luz-meta = { workspace = true }
luz-lensdb = { workspace = true }
luz-faces = { workspace = true }
miniz_oxide = { workspace = true }
# CRC-32 of a catalog unpacked from a Lightroom backup zip (lightroom_backup.rs).
crc32fast = { workspace = true }
luz-merge = { workspace = true }
luz-geocode = { workspace = true }
luz-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.13", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
luz-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
luz-fetch = { workspace = true }
# capture-time parsing for face recognition (native only)
chrono = { workspace = true }
# free space of the drive holding the preview cache (the low-disk alert; pure Rust: rustix / windows-sys)
fs4 = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:luz-segment"]
denoise = ["dep:luz-denoise", "luz-denoise/runtime", "luz-gpu/denoise"]
rawnind-model = ["denoise", "luz-denoise/rawnind-model", "luz-denoise-core/rawnind-model"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
luz-testkit = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
luz-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
luz-tiff = { workspace = true }
