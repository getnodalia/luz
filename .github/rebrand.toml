# What `scripts/rebrand.py` renames: upstream's LightCraft becomes Luz, in file contents and in
# paths. The weekly upstream sync applies the same rules to upstream's tree before merging it, so
# a rule added here applies to everything upstream sends from then on.
#
# Replacements are literal and case-sensitive, applied in order: put the longer, more specific
# ones first. Keep spans are found before any replacement, so a replacement never reaches inside
# one.

# Left as they are wherever they appear (in file contents and in paths).
keep = [
    # Links to upstream's issues, pull requests and commits, and to other people's repositories:
    # history, not branding. Links to upstream's tree and repository page are renamed below.
    "(https?://)?github\\.com/storytold/[\\w.-]+/(issues|pull|commit|discussions)/(?!new\\b)[^\\s)\\]\"'<>`]*",
    "https?://(github\\.com|raw\\.githubusercontent\\.com)/(?!storytold/lightcraft\\b|getnodalia|danielmigueltejedor)[^\\s)\\]\"'<>`]*",
    # Upstream's issues named without a link (`storytold/lightcraft#123`, `artcraft#2093`).
    "storytold/[\\w.-]+#\\d+",
    "\\b[a-z]+craft#\\d+",
    # Repositories named without a link: upstream's siblings and the shared test corpus.
    "storytold/(photocraft|vectorcraft|effectcraft|filmcraft|pdfcraft|designcraft)\\b",
    "photocraft-corpus",
    # Upstream's repository in the sync workflow and in the record of what came from it.
    "(?<=UPSTREAM_REPO: )storytold/lightcraft",
    # File signatures: libraries, presets and templates saved by LightCraft keep opening, and the
    # files Luz writes stay readable by it (`"format": "lightcraft.preset"` and its siblings, the
    # catalog snapshot's `"format":"lightcraft-catalog"`).
    "lightcraft(?=\\.(preset|curvePresets|maskEffects|printTemplate|slideshowTemplate)\\b)",
    "(?<=FORMAT: &str = \")lightcraft(?=-catalog)",
    "(?<=format\":\")lightcraft(?=-catal)",
    "(?<=format\\\\\":\\\\\")lightcraft(?=-catal)",
    # Credit for work done upstream.
    "LightCraft contributors",
    "ArtCraft Team",
]

# Files left alone entirely.
skip = [
    ".github/rebrand.toml",
    "scripts/rebrand.py",
    # Licence notices keep upstream's copyright line, which the licences require.
    "NOTICE",
    "LICENSE-*",
    "licenses/*",
    # The record of what came from upstream, and upstream's own README kept for reference.
    "docs/upstream.md",
    "docs/upstream-readme.md",
    # Upstream's brand marks and the READMEs that show them; this repository does not carry them.
    "docs/brand/*",
    "README.zh-*.md",
]

# Run after renaming: shorter names change how rustfmt wraps lines and sorts imports.
after = [["cargo", "fmt", "--all"]]

# Lines that keep this app's value when upstream's tree is rebranded (the sync passes --pin-from).
[[pin]]
file = "Cargo.toml"
pattern = '^version = "[^"]*"'

# Identity: app id, publisher, installer identities (a product of its own, never LightCraft's).
