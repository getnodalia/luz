[package]
name = "luz-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Luz egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
craft-window = { workspace = true }
luz-geom = { workspace = true }
luz-meta = { workspace = true }
luz-color = { workspace = true }
luz-raster = { workspace = true }
luz-develop = { workspace = true }
luz-pipeline = { workspace = true }
luz-catalog = { workspace = true }
web-time = { workspace = true }
luz-engine = { workspace = true }
luz-slideshow = { workspace = true }
luz-preview = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
luz-testkit = { workspace = true }
# The model-setup tests install and resume a real denoise model. Without this the engine's
# `default_loader` is the "this build cannot run denoise models" stub when the package is tested
# on its own (`cargo test -p luz-ui-egui`); a workspace test only passed by feature
# unification with the desktop app's default `denoise` feature.
luz-engine = { workspace = true, features = ["denoise"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
luz-denoise = { workspace = true, features = ["runtime"] }
luz-codecs = { workspace = true }
luz-faces = { workspace = true }
luz-merge = { workspace = true }
# a device for the GPU-resident view test (`render.rs`)
pollster = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nodalia-update = { workspace = true }
